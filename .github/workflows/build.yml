name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Read pnLibrary version
        id: pnlibrary
        run: echo "version=$(grep -m1 "^def pnLibraryVersion" build.gradle | cut -d"'" -f2)" >> "$GITHUB_OUTPUT"

      - name: Checkout pnLibrary
        uses: actions/checkout@v4
        with:
          repository: pnFolder/pnLibrary
          ref: v${{ steps.pnlibrary.outputs.version }}
          path: pnLibrary

      - name: Publish pnLibrary to Maven Local
        working-directory: pnLibrary
        run: |
          chmod +x gradlew
          JAVA_HOME="$JAVA_HOME_21_X64" ./gradlew publishToMavenLocal --no-daemon --no-build-cache

      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: pnCases
          path: build/libs/*.jar
          if-no-files-found: warn
