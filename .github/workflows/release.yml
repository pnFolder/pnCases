name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew clean build

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ github.event.repository.name }}
        run: |
          VERSION=$(sed -n "s/^version = ['\"]\([^'\"]*\)['\"].*/\1/p" build.gradle | head -n 1)
          test -n "$VERSION"
          JAR=$(ls build/libs/*.jar | grep -vE -- '-(plain|sources|javadoc)\.jar$' | head -n 1)
          test -f "$JAR"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists; refusing to overwrite it." >&2
            exit 1
          fi
          sha256sum "$JAR" > build/libs/SHA256SUMS.txt
          gh release create "v${VERSION}" "$JAR" build/libs/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "${NAME} ${VERSION}" \
            --generate-notes \
            --latest
