plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
    id 'com.gradleup.shadow' version '9.3.1'
}

group = 'ru.privatenull'
version = '1.5.4-remaster'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "fancyinnovations"
        url = "https://repo.fancyinnovations.com/releases"
    }
    maven {
        name = "jitpack"
        url = "https://jitpack.io"
    }
    maven {
        name = "rosewood"
        url = "https://repo.rosewooddev.io/repository/public/"
    }
    maven {
        name = "wesjd"
        url = "https://mvn.wesjd.net/"
    }
}

def pnLibraryVersion = '0.0.1-dev.5'

dependencies {
    // The shared runtime plugin is installed by the pnLibrary bootstrap that is shaded into the jar;
    // only its public API is needed to compile.
    implementation("io.github.pnfolder:pnlibrary-bootstrap-bukkit:${pnLibraryVersion}")
    compileOnly("io.github.pnfolder:pnlibrary-api:${pnLibraryVersion}")
    testImplementation("io.github.pnfolder:pnlibrary-api:${pnLibraryVersion}")
    compileOnly("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")
    compileOnly("de.oliver:FancyHolograms:2.10.0")
    compileOnly("com.github.decentsoftware-eu.decentholograms:plugin:2.10.1")
    compileOnly("net.dmulloy2:ProtocolLib:5.4.0")
    compileOnly("com.mojang:authlib:1.5.25")
    compileOnly("com.github.MilkBowl:VaultAPI:1.7.1")
    compileOnly("org.black_ixx:playerpoints:3.3.5")
    compileOnly("net.wesjd:anvilgui:1.10.13-SNAPSHOT")
    implementation(project(":anvilgui-compat"))
    implementation("org.mongodb:mongodb-driver-sync:5.2.1")
    implementation("com.zaxxer:HikariCP:5.1.0")
    implementation("com.mysql:mysql-connector-j:9.1.0")
    implementation("redis.clients:jedis:7.5.3")
    compileOnly("org.xerial:sqlite-jdbc:3.53.2.0")
    compileOnly("net.kyori:adventure-text-serializer-legacy:4.17.0")
    testImplementation("org.junit.jupiter:junit-jupiter:5.11.4")
    testImplementation("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")
    testRuntimeOnly("org.xerial:sqlite-jdbc:3.53.2.0")
}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("1.21")
    }

    shadowJar {
        archiveClassifier.set('')
        manifest {
            attributes 'paperweight-mappings-namespace': 'spigot'
        }
        mergeServiceFiles()
        // Runtime services (lifecycle, updates, metrics, logging) belong to the installed pnLibrary plugin.
        relocate('net.wesjd.anvilgui', 'ru.privatenull.pncases.libs.anvilgui')
        relocate('redis.clients.jedis', 'ru.privatenull.pncases.libs.jedis')
        relocate('org.apache.commons.pool2', 'ru.privatenull.pncases.libs.pool2')
        relocate('com.zaxxer.hikari', 'ru.privatenull.pncases.libs.hikari')
        relocate('org.pnfolder.pnlibrary.bootstrap', 'ru.privatenull.pncases.libs.pnbootstrap')
        relocate('org.pnfolder.pnlibrary.bukkit.bootstrap', 'ru.privatenull.pncases.libs.pnbootstrap.bukkit')
        relocate('org.pnfolder.pnlibrary.console', 'ru.privatenull.pncases.libs.pnbootstrap.console')
    }

    jar {
        archiveClassifier.set('plain')
    }

    build {
        dependsOn shadowJar
    }
}

def targetJavaVersion = 17
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

configurations.configureEach {
    attributes.attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 21)
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
