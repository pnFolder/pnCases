# ───────────────────── pnCases 1.5.2 ─────────────────────

# Модули: true — включить, false — выключить.
modules:
  rarity: true         # Редкости наград
  preview: true        # Просмотр содержимого кейса
  gui-animation: true  # Анимация появления предметов в GUI
  title: true          # Анимация заголовка GUI

# ───────────────────── Хранилище ─────────────────────
database:
  type: SQLITE # SQLITE, MYSQL или MONGODB
  sqlite:
    file: data.db
    connection-timeout-ms: 10000
  mysql:
    host: localhost
    port: 3306
    database: pncases
    username: root
    password: ""
    parameters: "useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    pool-size: 10
    connection-timeout-ms: 10000
  mongodb:
    uri: "mongodb://localhost:27017"
    database: pncases
    collection: pncases

# ───────────────────── Голограммы ─────────────────────
holograms:
  provider: AUTO # AUTO, FANCY или DECENT

# ───────────────────── Символы наград ─────────────────────
reward-symbols:
  vault: "$"
  playerpoints: "✦"
