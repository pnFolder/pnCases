# Переключатели функций.
features:
  rarity: true
  preview: true

# Тип хранилища: SQLITE, MYSQL, MONGODB или REDIS. Смена требует перезапуска.
database:
  type: SQLITE
  sqlite:
    file: data.db
    connection-timeout-ms: 10000
  mysql:
    host: localhost
    port: 3306
    database: pncases
    username: root
    password: ""
    parameters: "useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    pool-size: 10
    connection-timeout-ms: 10000
  mongodb:
    uri: "mongodb://localhost:27017"
    database: pncases
    collection: pncases
  redis:
    uri: "redis://localhost:6379/0"
    namespace: "pncases"

# Локализация предметов: ru_ru или en_us.
localization:
  locale: ru_ru

# Провайдер голограмм: AUTO, FANCY или DECENT.
holograms:
  provider: AUTO

# Названия редкостей. {id} содержит ID пользовательской редкости.
rarity:
  default: "&f◆ {id}"
  common: "&7◇ Обычная"
  uncommon: "&a◆ Необычная"
  rare: "&9◆ Редкая"
  epic: "&5✦ Эпическая"
  legendary: "&6★ Легендарная"
  mythic: "&d✹ Мифическая"

# Стиль голограммы награды в анимациях.
animations:
  reward-hologram:
    scale: 1.45
    height-offset: 0.16
    visibility-distance: 48
    brightness: 15
    movement-ticks: 2
    reveal-delay-ticks: 6
