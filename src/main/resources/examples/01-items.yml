# ПРИМЕР: награды-предметы (type: ITEM). Предмет выдаётся прямо в инвентарь игрока.
blocks: []
display-name: '&aКейс с предметами'

gui:
  title: '{display-name}'
  size: 27
  open_slot: 13
  preview_enabled: true   # ЛКМ показывает содержимое, ПКМ открывает

animation:
  fixed: ANVIL            # одна и та же анимация всегда. Без этой строки анимация случайная
  items:                  # предметы, которые мелькают в анимации
    - material: DIAMOND
    - material: IRON_INGOT
    - material: GOLDEN_APPLE

rewards:
  # Обычный предмет: material и amount.
  - type: ITEM
    chance: 50            # вес. Шанс = chance / сумма всех chance
    rarity: COMMON
    message: '&aВы получили {reward} в количестве {amount}!'
    item:
      material: IRON_INGOT
      amount: 16

  # Предмет с названием и описанием.
  - type: ITEM
    chance: 30
    rarity: UNCOMMON
    item:
      material: EMERALD
      amount: 5
      name: '&aИзумруды удачи'
      lore:
        - '&7Выпали из кейса'

  # Зачарованный предмет. Название зачарования пиши как в игре (английское, маленькими буквами).
  - type: ITEM
    chance: 15
    rarity: EPIC
    item:
      material: DIAMOND_SWORD
      name: '&bМеч победителя'
      enchantments:
        sharpness: 5
        unbreaking: 3

  # Кастомная голова: вместо material указывается base64 текстуры.
  - type: ITEM
    chance: 5
    rarity: LEGENDARY
    item:
      base64: 'eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNTExM2VlNjEwODQxZGVkMjE1YWNkMmI0Y2FhZWVmODdkZmQ2ZTNkNDc2OGU3YWI0ZTE5ZWI3NmIzZDgxMjFjZiJ9fX0='
      name: '&6Золотая голова'
