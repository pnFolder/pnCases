# ПРИМЕР: кейс-контейнер. Один блок открывает меню, где игрок выбирает один из нескольких кейсов.
# Пустой контейнер сам ничего не выдаёт: у него нет rewards, только список кейсов.
# Кейсы внутри должны лежать в папке cases. Здесь это кейсы из примеров 01-04.
blocks: []
display-name: '&6Все кейсы'

bundle:
  title: 'Выбери кейс'
  cases:
    - 01-items
    - 02-economy
    - 03-luckperms
    - 04-console
  # Если у контейнера есть свои rewards, он добавляет и свою кнопку первой.
  # include_self: false убирает эту кнопку.
