# pnCases — тексты и стили интерфейса игроков
#
# Плейсхолдеры выбора анимации:
# {animation} — название выбранной анимации.
# {case}, {case_id} — название и ID редактируемого кейса.
#
# Плейсхолдеры истории:
# {player} — игрок, открывший кейс.
# {reward} — название выпавшей награды.
# {time} — время открытия.
#
# Плейсхолдеры содержимого кейса:
# {reward}, {case}, {case_id} — награда и данные кейса.
# {rarity} — полностью оформленная редкость: цвет, символ и название.
# {chance} — вероятность выпадения.
#
# Слоты, навигация, системные иконки и Machine GUI находятся в коде.

case:
  animation-button:
    name: '&#5FD7FFАнимация открытия'
    lore:
      - ''
      - ' &#A6B0BAНастройка отображения кейса'
      - ''
      - ' &#C2CBD3Анимация'
      - ' &#69747E↳ &#A7F3D0{animation}'
      - ''
      - ' &#FFB347[&#FFA43C Л&#FF9536К&#FF8630М &#FF772A] &fИзменить'
      - ' &#FF8A8A[&#FF7979 П&#F96868К&#F25757М &#EB4646] &fСбросить'
      - ''

  history:
    item:
      name: "&#5FD7FF{reward}"
      lore:
        - ''
        - ' &#A6B0BAПоследнее открытие этого кейса'
        - ''
        - ' &#C2CBD3Игрок'
        - ' &#69747E↳ &#A7F3D0{player}'
        - ' &#C2CBD3Награда'
        - ' &#69747E↳ &#A7F3D0{reward}'
        - ' &#C2CBD3Время'
        - ' &#69747E↳ &#A7F3D0{time}'
        - ''
    empty:
      name: "&#5FD7FFИстория открытий"
      lore:
        - ''
        - ' &#A6B0BAЗдесь появятся последние'
        - ' &#A6B0BAполученные игроками награды'
        - ''

preview:
  title: "&0Содержимое кейса"
  reward:
    name: "{reward}"
    lore:
      - ""
      # Тип: {type}
      # Количество предметов: &#FCA865{item_amount}
      # Количество: &#FCA865{amount}
      # Группа: &d{group}
      # Право: &b{permission}
      # Срок: &d{duration}
      # Шанс: &#FCA865{chance}
      # Редкость: {rarity}
