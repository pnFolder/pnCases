# pnCases — тексты и стили интерфейса игроков
#
# Плейсхолдеры выбора анимации:
# {animation} — название выбранной анимации.
# {case}, {case_id} — название и ID редактируемого кейса.
#
# Плейсхолдеры истории:
# {player} — игрок, открывший кейс.
# {reward} — название выпавшей награды.
# {time} — время открытия.
#
# Плейсхолдеры содержимого кейса:
# {reward}, {case}, {case_id} — награда и данные кейса.
# {rarity_name}, {rarity_id} — оформленное название и ID редкости.
# {chance} — вероятность выпадения.
# {amount}, {item_amount}, {duration} — параметры награды.
#
# В rarities можно свободно менять оформленное name и glow.
# Слоты, навигация, системные иконки и Machine GUI находятся в коде.

case:
  animation-button:
    name: "&x&A&F&9&2&F&FВыбор анимации"
    lore:
      - ""
      - "&#9EFC65 «Текущие параметры»"
      - " &7- &fАнимация: {animation}"
      - ""
      - "&#65D1FC «Действие»"
      - " &7- &fЛКМ — открыть выбор"
      - ""

  history:
    item:
      name: "&x&A&0&E&F&A&1◆ {reward}"
      lore:
        - ""
        - "&#9EFC65 «Основная информация»"
        - " &7- &fИгрок: &x&F&B&C&A&0&8{player}"
        - " &7- &fНаграда: {reward}"
        - ""
        - "&#65D1FC «Время открытия»"
        - " &7- &f{time}"
        - ""
    empty:
      name: "&8История пуста"
      lore:
        - ""
        - "&#9EFC65 «Основная информация»"
        - " &7- &fПоследние открытия кейса"
        - " &7- &fбудут отображаться здесь."
        - ""

preview:
  title: "&0Содержимое кейса"

  reward:
    name: "{rarity_name} &f{reward}"
    lore:
      - ""
      - "&#9EFC65 «Основная информация»"
      - " &7- &fРедкость: {rarity_name}"
      - ""
      - "&#65D1FC «Вероятность»"
      - " &7- &fВыпадение: &#FCA865{chance}"
    type-lore:
      item:
        - ""
        - "&#FCA965 «Награда»"
        - " &7- &fКоличество: &#FCA865{item_amount}"
        - ""
      vault:
        - ""
        - "&#FCA965 «Награда»"
        - " &7- &fМонеты: &a{amount}"
        - ""
      playerpoints:
        - ""
        - "&#FCA965 «Награда»"
        - " &7- &fПоинты: &b{amount}"
        - ""
      luckperms:
        - ""
        - "&#FCA965 «Награда»"
        - " &7- &fСрок: &d{duration}"
        - ""
      personal: []

  rarities:
    default:
      name: "&f◆ {rarity_id}"
      glow: false
    common:
      name: "&7◇ Обычная"
      glow: false
    uncommon:
      name: "&a◆ Необычная"
      glow: false
    rare:
      name: "&9◆ Редкая"
      glow: false
    epic:
      name: "&5✦ Эпическая"
      glow: true
    legendary:
      name: "&6★ Легендарная"
      glow: true
    mythic:
      name: "&d✹ Мифическая"
      glow: true
